<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8d5f2"/>
      <stop offset="60%" stop-color="#dceaf7"/>
      <stop offset="100%" stop-color="#eef4fa"/>
    </linearGradient>
    <linearGradient id="wallBlue" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0a2566"/>
      <stop offset="100%" stop-color="#123b8f"/>
    </linearGradient>
    <linearGradient id="wallWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdfdfd"/>
      <stop offset="100%" stop-color="#eaeef5"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f3b60" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0e1f38" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="650" fill="url(#skyGrad)"/>

  <!-- Background foliage / trees -->
  <path d="M0,280 Q40,240 80,270 Q130,220 180,260 Q210,240 250,280 L250,380 L0,380 Z" fill="#2d5e35" opacity="0.4"/>
  <path d="M0,290 Q50,260 90,280 Q140,245 190,280 L190,380 L0,380 Z" fill="#3a7544" opacity="0.6"/>

  <!-- Building structure (Perspective view) -->
  <!-- Upper roof canopy / parapet -->
  <polygon points="0,170 380,210 380,225 0,185" fill="#5c6f84"/>
  <polygon points="380,210 800,195 800,210 380,225" fill="#3f4e60"/>

  <!-- Left building wing (Perspective) -->
  <polygon points="0,185 380,225 380,480 0,420" fill="url(#wallWhite)"/>
  <!-- Windows on left wing -->
  <polygon points="30,225 150,240 150,320 30,300" fill="url(#glass)"/>
  <polygon points="30,225 150,240 150,320 30,300" fill="url(#glassReflect)"/>
  <polygon points="190,245 340,260 340,340 190,325" fill="url(#glass)"/>
  <polygon points="190,245 340,260 340,340 190,325" fill="url(#glassReflect)"/>

  <!-- Main front facade / entrance wall -->
  <polygon points="380,225 800,210 800,530 380,560" fill="url(#wallWhite)"/>

  <!-- Prominent Blue Accent Wall on Main Entrance -->
  <polygon points="380,360 800,325 800,530 380,560" fill="url(#wallBlue)"/>

  <!-- Main Institutional Signboard Wall -->
  <rect x="410" y="240" width="360" height="150" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Institutional Winged Crest on Signboard -->
  <g transform="translate(435, 275) scale(0.65)">
    <!-- Shield -->
    <path d="M40,10 L75,10 Q80,45 40,75 Q0,45 5,10 Z" fill="#08173e"/>
    <!-- Wings left & right -->
    <path d="M5,25 C-25,10 -35,-5 -50,-20 C-35,5 -20,25 0,40 Z" fill="#1b3d7a"/>
    <path d="M75,25 C105,10 115,-5 130,-20 C115,5 100,25 80,40 Z" fill="#1b3d7a"/>
    <!-- Book -->
    <path d="M22,35 Q40,30 40,42 Q40,30 58,35 L58,52 Q40,47 40,58 Q40,47 22,52 Z" fill="#ffffff"/>
    <line x1="40" y1="36" x2="40" y2="58" stroke="#d5a75b" stroke-width="2"/>
    <!-- Star / Sun rays -->
    <circle cx="40" cy="20" r="5" fill="#f0bb5b"/>
  </g>

  <!-- Signboard Text -->
  <text x="515" y="285" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="900" fill="#08173e" letter-spacing="1">UNIVERSITY PATHWAY</text>
  <text x="515" y="310" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="800" fill="#c62839" letter-spacing="2">EDUCATIONAL CONSULT</text>
  <text x="515" y="335" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-size="12" fill="#55627a">....the fastest route to university</text>

  <!-- Entrance doors & glass lower level -->
  <polygon points="560,400 740,385 740,520 560,535" fill="url(#glass)"/>
  <!-- Glass reflection bars -->
  <polygon points="580,400 630,395 630,530 580,533" fill="#ffffff" opacity="0.15"/>
  <polygon points="670,392 720,387 720,522 670,526" fill="#ffffff" opacity="0.15"/>
  <line x1="650" y1="392" x2="650" y2="527" stroke="#ffffff" stroke-width="3" opacity="0.4"/>

  <!-- Pavement / ground -->
  <polygon points="0,420 380,560 800,530 800,650 0,650" fill="#e2e8f0"/>
  <polygon points="0,450 380,580 800,550 800,650 0,650" fill="#cbd5e1"/>

  <!-- Decorative shrubbery -->
  <circle cx="390" cy="565" r="28" fill="#1e4620"/>
  <circle cx="420" cy="560" r="22" fill="#2d6630"/>
  <circle cx="365" cy="570" r="20" fill="#27572a"/>
  
  <!-- Subtle tree branches at top right as seen in reference -->
  <path d="M720,0 Q750,60 800,90 M760,20 Q730,70 710,120 M780,50 Q750,110 770,160" stroke="#1d4220" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.75"/>
  <circle cx="730" cy="70" r="25" fill="#2d6630" opacity="0.8"/>
  <circle cx="760" cy="40" r="30" fill="#3a7544" opacity="0.85"/>
  <circle cx="780" cy="110" r="28" fill="#234e26" opacity="0.8"/>
</svg>
