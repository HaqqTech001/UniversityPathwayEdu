name: UPEC Verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Run CBT logic and recovery tests
        run: node --test src/portal/practiceEngine.test.js src/portal/practiceQuestions.test.js src/portal/practiceSelection.test.js src/portal/practicePaper.test.js src/portal/practiceHistory.test.js src/portal/sampleCbtSession.test.js src/registration/applicationSchema.test.js
      - run: npm run lint
      - run: npm run build
  ops:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run build
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install API dependencies
        run: npm install --no-audit --no-fund
      - name: Run API tests
        run: npm test
      - name: Check API JavaScript syntax
        run: |
          for file in src/*.js; do node --check "$file" || exit 1; done

  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install admin dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check standalone admin
        run: npm run lint
      - name: Build standalone admin
        run: npm run build
