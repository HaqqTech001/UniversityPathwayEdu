name: UPEC Notification Delivery
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke protected notification worker
        env:
          API_URL: ${{ secrets.UPEC_API_URL }}
          WORKER_SECRET: ${{ secrets.UPEC_NOTIFICATION_WORKER_SECRET }}
        run: |
          test -n "$API_URL" && test -n "$WORKER_SECRET" || { echo 'Missing API URL or worker secret'; exit 1; }
          curl --fail-with-body --retry 2 --retry-delay 5 --max-time 110 \
            --request POST --header "Authorization: Bearer $WORKER_SECRET" \
            "${API_URL%/}/api/internal/notifications/process"
